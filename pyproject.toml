[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-data-pipeline"
version = "1.0.0"
description = "Internal tool for pulling daily sales data from the API, filtering by region, and archiving results."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.scripts]
sales-pipeline = "sales_data_pipeline.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "responses",
]

[tool.setuptools.packages.find]
where = ["src"]
